name: Agent Dev Server Deploy

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent_dev_server
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  IMAGE_NAME: ieum-agent-dev

jobs:
  deploy:
    # Covers bounded cross-repository lock waiting plus this job's build and deployment.
    timeout-minutes: 360
    name: Deploy Agent to Self Hosted Server
    runs-on:
      group: ieum_dev_server
      labels: [self-hosted, linux, x64, ieum-agent]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c requirements.lock.txt

      - name: Test
        env:
          APP_MONGODB_URL: ${{ secrets.AGENT_MONGODB_URL }}
          TEST_MONGODB_URL: ${{ secrets.AGENT_TEST_MONGODB_URL }}
          TEST_MONGODB_DB_NAME: ${{ secrets.AGENT_TEST_MONGODB_DB_NAME }}
        run: |
          export MONGODB_URL="${TEST_MONGODB_URL:-$APP_MONGODB_URL}"
          export MONGODB_DB_NAME="${TEST_MONGODB_DB_NAME:-ieum_test}"

          pytest tests/

      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE_NAME:${{ github.sha }} \
            -t $IMAGE_NAME:latest .

      - name: Verify installed blue-green release
        env:
          CONTROLLER_SHA: ${{ vars.BLUEGREEN_CONTROLLER_SHA256 }}
          HELPER_SHA: ${{ vars.BLUEGREEN_HELPER_SHA256 }}
        run: |
          set -euo pipefail
          if [[ ! "$CONTROLLER_SHA" =~ ^[a-f0-9]{64}$ || ! "$HELPER_SHA" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Configure the approved BLUEGREEN_CONTROLLER_SHA256 and BLUEGREEN_HELPER_SHA256 variables first"
            exit 1
          fi
          if ! printf '%s  %s\n' \
            "$CONTROLLER_SHA" /home/kwung/deploy/bluegreen/bluegreen.py \
            "$HELPER_SHA" /usr/local/sbin/ieum-bluegreen-nginx | sha256sum -c - >/dev/null 2>&1; then
            echo "::error::Installed blue-green controller/helper does not match the approved release"
            exit 1
          fi

      - name: Deploy with a private candidate environment
        env:
          IMAGE_TAG: ${{ github.sha }}
          MONGODB_URL: ${{ secrets.AGENT_MONGODB_URL }}
          MONGODB_DB_NAME: ${{ secrets.AGENT_MONGODB_DB_NAME }}
          PORT: ${{ secrets.AGENT_PORT }}
          CLAUDE_DEFAULT_MODEL: ${{ secrets.AGENT_CLAUDE_DEFAULT_MODEL }}
          OPENAI_DEFAULT_MODEL: ${{ secrets.AGENT_OPENAI_DEFAULT_MODEL }}
          GEMINI_DEFAULT_MODEL: ${{ secrets.AGENT_GEMINI_DEFAULT_MODEL }}
          NOTION_MCP_URL: ${{ secrets.AGENT_NOTION_MCP_URL }}
          NOTION_MCP_AUTH_TOKEN: ${{ secrets.AGENT_NOTION_MCP_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          candidate_env="$(mktemp "$RUNNER_TEMP/ieum-agent-env.XXXXXX")"
          trap 'rm -f -- "$candidate_env"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          python3 - "$candidate_env" <<'PY'
          import os
          import sys
          from pathlib import Path

          required = ('MONGODB_URL', 'MONGODB_DB_NAME', 'PORT', 'CLAUDE_DEFAULT_MODEL',
                      'OPENAI_DEFAULT_MODEL', 'GEMINI_DEFAULT_MODEL')
          optional = ('NOTION_MCP_URL', 'NOTION_MCP_AUTH_TOKEN')
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit('Missing GitHub Secrets for: ' + ', '.join('AGENT_' + key for key in missing))
          values = {key: os.environ[key] for key in required + optional if os.environ.get(key)}
          if any('\n' in value or '\r' in value for value in values.values()):
              raise SystemExit('Agent environment values must be single lines')
          Path(sys.argv[1]).write_text(''.join(key + '=' + value + '\n' for key, value in values.items()))
          PY
          python3 /home/kwung/deploy/bluegreen/bluegreen.py --lock-timeout 14400 deploy \
            --service agent \
            --image "$IMAGE_NAME:$IMAGE_TAG" \
            --env-file "$candidate_env"
