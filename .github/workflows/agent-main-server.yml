name: Agent Main Server Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent_main_server
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: ${{ secrets.AGENT_PYTHON_VERSION }}
  IMAGE_NAME: ${{ secrets.AWS_AGENT_IMAGE_NAME }}
  CONTAINER_NAME: ${{ secrets.AWS_AGENT_CONTAINER_NAME }}
  DOCKER_NETWORK: ${{ secrets.AWS_DOCKER_NETWORK }}
  DOCKER_NETWORK_SUBNET: ${{ secrets.AWS_DOCKER_NETWORK_SUBNET }}
  AGENT_IP: ${{ secrets.AWS_AGENT_IP }}
  AGENT_PORT: ${{ secrets.AWS_AGENT_PORT }}
  AGENT_HOST_PORT: ${{ secrets.AWS_AGENT_HOST_PORT }}

jobs:
  deploy:
    name: Deploy Agent Main to EC2
    runs-on:
      group: ieum_main_server
      labels: [self-hosted, linux, x64, ieum-agent, main, deploy]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        run: |
          set -euo pipefail

          missing_vars=()
          for name in \
            PYTHON_VERSION \
            IMAGE_NAME \
            CONTAINER_NAME \
            DOCKER_NETWORK \
            DOCKER_NETWORK_SUBNET \
            AGENT_IP \
            AGENT_PORT \
            AGENT_HOST_PORT
          do
            [ -n "${!name}" ] || missing_vars+=("$name")
          done

          if [ ${#missing_vars[@]} -gt 0 ]; then
            echo "::error::Missing deploy secrets for: ${missing_vars[*]}"
            exit 1
          fi

      - name: Validate app secrets
        env:
          AGENT_MONGODB_URL: ${{ secrets.AWS_AGENT_MONGODB_URL }}
          AGENT_MONGODB_DB_NAME: ${{ secrets.AWS_AGENT_MONGODB_DB_NAME }}
          AGENT_CLAUDE_DEFAULT_MODEL: ${{ secrets.AGENT_CLAUDE_DEFAULT_MODEL }}
          AGENT_OPENAI_DEFAULT_MODEL: ${{ secrets.AGENT_OPENAI_DEFAULT_MODEL }}
          AGENT_GEMINI_DEFAULT_MODEL: ${{ secrets.AGENT_GEMINI_DEFAULT_MODEL }}
          AGENT_NOTION_MCP_URL: ${{ secrets.AWS_AGENT_NOTION_MCP_URL }}
          AGENT_NOTION_MCP_AUTH_TOKEN: ${{ secrets.AGENT_NOTION_MCP_AUTH_TOKEN }}
        run: |
          set -euo pipefail

          missing_vars=()
          for name in \
            AGENT_MONGODB_URL \
            AGENT_MONGODB_DB_NAME \
            AGENT_CLAUDE_DEFAULT_MODEL \
            AGENT_OPENAI_DEFAULT_MODEL \
            AGENT_GEMINI_DEFAULT_MODEL \
            AGENT_NOTION_MCP_URL \
            AGENT_NOTION_MCP_AUTH_TOKEN
          do
            [ -n "${!name}" ] || missing_vars+=("$name")
          done

          if [ ${#missing_vars[@]} -gt 0 ]; then
            echo "::error::Missing app secrets for: ${missing_vars[*]}"
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build Docker image
        run: |
          set -euo pipefail

          docker build \
            -t "$IMAGE_NAME:${{ github.sha }}" \
            -t "$IMAGE_NAME:latest" .

      - name: Restart agent container
        env:
          AGENT_MONGODB_URL: ${{ secrets.AWS_AGENT_MONGODB_URL }}
          AGENT_MONGODB_DB_NAME: ${{ secrets.AWS_AGENT_MONGODB_DB_NAME }}

          AGENT_CLAUDE_DEFAULT_MODEL: ${{ secrets.AGENT_CLAUDE_DEFAULT_MODEL }}
          AGENT_OPENAI_DEFAULT_MODEL: ${{ secrets.AGENT_OPENAI_DEFAULT_MODEL }}
          AGENT_GEMINI_DEFAULT_MODEL: ${{ secrets.AGENT_GEMINI_DEFAULT_MODEL }}

          AGENT_NOTION_MCP_URL: ${{ secrets.AWS_AGENT_NOTION_MCP_URL }}
          AGENT_NOTION_MCP_AUTH_TOKEN: ${{ secrets.AGENT_NOTION_MCP_AUTH_TOKEN }}

          PLATFORM_GEMINI_API_KEY: ${{ secrets.PLATFORM_GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.AWS_OTEL_EXPORTER_OTLP_ENDPOINT }}
        run: |
          set -euo pipefail

          docker network inspect "$DOCKER_NETWORK" >/dev/null 2>&1 \
            || docker network create --subnet "$DOCKER_NETWORK_SUBNET" "$DOCKER_NETWORK"

          docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true

          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p "$AGENT_HOST_PORT:$AGENT_PORT" \
            --network "$DOCKER_NETWORK" \
            --ip "$AGENT_IP" \
            -e MONGODB_URL="$AGENT_MONGODB_URL" \
            -e MONGODB_DB_NAME="$AGENT_MONGODB_DB_NAME" \
            -e PORT="$AGENT_PORT" \
            -e CLAUDE_DEFAULT_MODEL="$AGENT_CLAUDE_DEFAULT_MODEL" \
            -e OPENAI_DEFAULT_MODEL="$AGENT_OPENAI_DEFAULT_MODEL" \
            -e GEMINI_DEFAULT_MODEL="$AGENT_GEMINI_DEFAULT_MODEL" \
            -e NOTION_MCP_URL="$AGENT_NOTION_MCP_URL" \
            -e NOTION_MCP_AUTH_TOKEN="$AGENT_NOTION_MCP_AUTH_TOKEN" \
            -e PLATFORM_GEMINI_API_KEY="$PLATFORM_GEMINI_API_KEY" \
            -e TAVILY_API_KEY="$TAVILY_API_KEY" \
            -e OTEL_EXPORTER_OTLP_ENDPOINT="$OTEL_EXPORTER_OTLP_ENDPOINT" \
            "$IMAGE_NAME:latest"

      - name: Health check
        run: |
          set -euo pipefail

          for i in $(seq 1 30); do
            if curl -fsS "http://$AGENT_IP:$AGENT_PORT/health" >/dev/null \
              && curl -fsS "http://127.0.0.1:$AGENT_HOST_PORT/health" >/dev/null; then
              exit 0
            fi

            sleep 2
          done

          docker logs --tail 100 "$CONTAINER_NAME"
          exit 1
