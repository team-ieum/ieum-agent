name: Agent Main Blue Green Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Build, stage private bootstrap inputs, or deploy Main
        type: choice
        required: true
        default: build
        options: [build, stage-bootstrap, deploy]

permissions:
  contents: read
  actions: read

concurrency:
  group: agent_main_server
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      archive_sha256: ${{ steps.package.outputs.archive_sha256 }}
      image_id: ${{ steps.package.outputs.image_id }}
    env:
      PYTHON_VERSION: ${{ secrets.MAIN_COM_AGENT_PYTHON_VERSION }}
      IMAGE_NAME: ${{ secrets.MAIN_COM_AGENT_IMAGE_NAME }}
      PYTHON_DOTENV_DISABLED: '1'
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017/tcp
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - name: Validate Main build settings
        run: python3 scripts/bluegreen/main_image.py validate-build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c requirements.lock.txt

      - name: Test with isolated CI MongoDB
        env:
          MONGODB_URL: mongodb://127.0.0.1:${{ job.services.mongo.ports['27017'] }}/ieum_test
          MONGODB_DB_NAME: ieum_test
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/bluegreen -p 'test_*.py'
          pytest tests/

      - name: Build Main image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -t "$IMAGE_NAME:$IMAGE_TAG" .

      - name: Package verified Main image
        id: package
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          directory="$(mktemp -d "$RUNNER_TEMP/ieum-agent-main-image.XXXXXX")"
          python3 scripts/bluegreen/main_image.py package \
            --file "$directory/image.tar" --image "$IMAGE_NAME:$IMAGE_TAG"
          printf 'directory=%s\n' "$directory" >> "$GITHUB_OUTPUT"

      - name: Upload image archive only
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: agent-main-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.package.outputs.directory }}/image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Record immutable build identity
        env:
          SOURCE_SHA: ${{ github.sha }}
          IMAGE_ID: ${{ steps.package.outputs.image_id }}
          ARCHIVE_SHA256: ${{ steps.package.outputs.archive_sha256 }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          python3 - <<'PYSUMMARY'
          import os
          import re
          values = {key: os.environ[key] for key in ('SOURCE_SHA', 'IMAGE_ID', 'ARCHIVE_SHA256', 'ARTIFACT_ID')}
          for key, pattern in [('SOURCE_SHA', r'[a-f0-9]{40}'), ('IMAGE_ID', r'sha256:[a-f0-9]{64}'),
                               ('ARCHIVE_SHA256', r'[a-f0-9]{64}'), ('ARTIFACT_ID', r'[1-9][0-9]*')]:
              if not re.fullmatch(pattern, values[key]):
                  raise SystemExit('Invalid immutable build metadata')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('## Verified Main build\n\n| Field | Value |\n|---|---|\n')
              for key, value in values.items():
                  output.write('| ' + key + ' | `' + value + '` |\n')
          PYSUMMARY

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.MAIN_DEPLOY_ENABLED == 'true' && (github.event_name == 'push' || inputs.operation == 'deploy')
    timeout-minutes: 360
    name: Deploy Main to isolated self-hosted blue-green controller
    runs-on:
      group: ieum_main_server
      labels: [self-hosted, linux, x64, ieum-agent, main, deploy]
    env:
      IEUM_DEPLOY_ENVIRONMENT: main
    steps:
      - name: Establish deployment job budget
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PYBUDGET'
          from datetime import datetime, timezone
          import json
          import os
          import time
          import urllib.request

          try:
              # A workflow attempt starts before this job, so queue/setup time reduces the budget too.
              run_id, attempt = os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT']
              endpoint = (os.environ['GITHUB_API_URL'].rstrip('/') + '/repos/' + os.environ['GITHUB_REPOSITORY']
                  + '/actions/runs/' + run_id + '/attempts/' + attempt)
              request = urllib.request.Request(endpoint, headers={
                  'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=15) as response:
                  raw = response.read(1024 * 1024 + 1)
              if len(raw) > 1024 * 1024:
                  raise ValueError()
              data = json.loads(raw)
              if str(data['id']) != run_id or str(data['run_attempt']) != attempt:
                  raise ValueError()
              started = datetime.fromisoformat(data['run_started_at'].replace('Z', '+00:00'))
              now = time.time()
              if started.tzinfo is None or started.timestamp() > now:
                  raise ValueError()
              # Leave two minutes before the runner's 360-minute job timeout.
              deadline = int(started.timestamp()) + 360 * 60 - 120
              if deadline - now < 9000:
                  raise ValueError()
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write('IEUM_BLUEGREEN_JOB_DEADLINE_EPOCH=' + str(deadline) + '\n')
          except Exception:
              # Never echo the request, token, response or environment.
              raise SystemExit('Unable to establish sufficient deployment job time; retry in a fresh job') from None
          PYBUDGET

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify installed Main controller
        env:
          CONTROLLER_SHA: ${{ vars.MAIN_BLUEGREEN_CONTROLLER_SHA256 }}
          HELPER_SHA: ${{ vars.MAIN_BLUEGREEN_HELPER_SHA256 }}
        run: |
          set -euo pipefail
          if [[ ! "$CONTROLLER_SHA" =~ ^[a-f0-9]{64}$ || ! "$HELPER_SHA" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Configure approved Main controller/helper SHA-256 variables"
            exit 1
          fi
          printf '%s  %s\n' \
            "$CONTROLLER_SHA" /home/kwung/deploy/bluegreen-main/bluegreen.py \
            "$HELPER_SHA" /usr/local/sbin/ieum-main-bluegreen-nginx | sha256sum -c - >/dev/null 2>&1

      - name: Create private image download directory
        id: image_directory
        run: |
          set -euo pipefail
          umask 077
          directory="$(mktemp -d "$RUNNER_TEMP/ieum-agent-main-download.XXXXXX")"
          printf 'directory=%s\n' "$directory" >> "$GITHUB_OUTPUT"

      - name: Download exact build artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ steps.image_directory.outputs.directory }}
          merge-multiple: true

      - name: Verify archive and loaded image identity
        env:
          IMAGE_DIRECTORY: ${{ steps.image_directory.outputs.directory }}
          IMAGE_NAME: ${{ secrets.MAIN_COM_AGENT_IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_ID: ${{ needs.build.outputs.image_id }}
          ARCHIVE_SHA256: ${{ needs.build.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          python3 scripts/bluegreen/main_image.py load \
            --file "$IMAGE_DIRECTORY/image.tar" --image "$IMAGE_NAME:$IMAGE_TAG" \
            --image-id "$IMAGE_ID" --sha256 "$ARCHIVE_SHA256"

      - name: Deploy with Main prefixed Secrets
        env:
          IMAGE_ID: ${{ needs.build.outputs.image_id }}
          IEUM_AGENT_SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          candidate_env="$(mktemp "$RUNNER_TEMP/ieum-agent-main-env.XXXXXX")"
          trap 'rm -f -- "$candidate_env"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          python3 scripts/bluegreen/agent_env.py "$candidate_env" --environment main
          unset IEUM_AGENT_SECRETS_JSON
          python3 /home/kwung/deploy/bluegreen-main/bluegreen.py --lock-timeout 14400 deploy \
            --job-deadline-epoch "$IEUM_BLUEGREEN_JOB_DEADLINE_EPOCH" \
            --service agent --image "$IMAGE_ID" \
            --env-file "$candidate_env" --replace-env

      - name: Remove downloaded image archive
        if: always()
        env:
          IMAGE_DIRECTORY: ${{ steps.image_directory.outputs.directory }}
        run: |
          python3 - <<'PYCLEAN'
          import os
          from pathlib import Path
          import shutil
          value = os.environ.get('IMAGE_DIRECTORY', '')
          if value:
              directory = Path(value)
              if (directory.parent != Path(os.environ['RUNNER_TEMP'])
                      or not directory.name.startswith('ieum-agent-main-download.')
                      or directory.is_symlink()):
                  raise SystemExit('Invalid Main image cleanup directory')
              shutil.rmtree(directory)
          PYCLEAN

  stage_bootstrap:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'stage-bootstrap' && vars.MAIN_BOOTSTRAP_ENABLED == 'true'
    timeout-minutes: 30
    name: Stage Main bootstrap inputs without starting containers
    runs-on:
      group: ieum_main_server
      labels: [self-hosted, linux, x64, ieum-agent, main, deploy]
    env:
      IEUM_DEPLOY_ENVIRONMENT: main
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify installed Main controller
        env:
          CONTROLLER_SHA: ${{ vars.MAIN_BLUEGREEN_CONTROLLER_SHA256 }}
          HELPER_SHA: ${{ vars.MAIN_BLUEGREEN_HELPER_SHA256 }}
        run: |
          set -euo pipefail
          if [[ ! "$CONTROLLER_SHA" =~ ^[a-f0-9]{64}$ || ! "$HELPER_SHA" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Configure approved Main controller/helper SHA-256 variables"
            exit 1
          fi
          printf '%s  %s\n' \
            "$CONTROLLER_SHA" /home/kwung/deploy/bluegreen-main/bluegreen.py \
            "$HELPER_SHA" /usr/local/sbin/ieum-main-bluegreen-nginx | sha256sum -c - >/dev/null 2>&1

      - name: Create private image download directory
        id: image_directory
        run: |
          set -euo pipefail
          umask 077
          directory="$(mktemp -d "$RUNNER_TEMP/ieum-agent-main-download.XXXXXX")"
          printf 'directory=%s\n' "$directory" >> "$GITHUB_OUTPUT"

      - name: Download exact build artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ steps.image_directory.outputs.directory }}
          merge-multiple: true

      - name: Verify archive and loaded image identity
        env:
          IMAGE_DIRECTORY: ${{ steps.image_directory.outputs.directory }}
          IMAGE_NAME: ${{ secrets.MAIN_COM_AGENT_IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_ID: ${{ needs.build.outputs.image_id }}
          ARCHIVE_SHA256: ${{ needs.build.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          python3 scripts/bluegreen/main_image.py load \
            --file "$IMAGE_DIRECTORY/image.tar" --image "$IMAGE_NAME:$IMAGE_TAG" \
            --image-id "$IMAGE_ID" --sha256 "$ARCHIVE_SHA256"

      - name: Stage Main bootstrap settings
        env:
          IMAGE_ID: ${{ needs.build.outputs.image_id }}
          IEUM_AGENT_SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          candidate_env="$(mktemp "$RUNNER_TEMP/ieum-agent-main-env.XXXXXX")"
          trap 'rm -f -- "$candidate_env"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          python3 scripts/bluegreen/agent_env.py "$candidate_env" --environment main
          unset IEUM_AGENT_SECRETS_JSON
          python3 /home/kwung/deploy/bluegreen-main/bluegreen.py --lock-timeout 30 stage-bootstrap \
            --service agent --image "$IMAGE_ID" \
            --env-file "$candidate_env"

      - name: Remove downloaded image archive
        if: always()
        env:
          IMAGE_DIRECTORY: ${{ steps.image_directory.outputs.directory }}
        run: |
          python3 - <<'PYCLEAN'
          import os
          from pathlib import Path
          import shutil
          value = os.environ.get('IMAGE_DIRECTORY', '')
          if value:
              directory = Path(value)
              if (directory.parent != Path(os.environ['RUNNER_TEMP'])
                      or not directory.name.startswith('ieum-agent-main-download.')
                      or directory.is_symlink()):
                  raise SystemExit('Invalid Main image cleanup directory')
              shutil.rmtree(directory)
          PYCLEAN
