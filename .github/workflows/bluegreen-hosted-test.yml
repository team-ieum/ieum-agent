name: Blue Green Hosted Test (Temporary)

on:
  push:
    branches: ['infra/IEUM-AI-81']

permissions:
  contents: read

concurrency:
  group: bluegreen-hosted-test-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  IMAGE_NAME: ieum-agent-hosted-test
  PYTHON_DOTENV_DISABLED: '1'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017/tcp
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c requirements.lock.txt

      - name: Test with isolated MongoDB
        env:
          MONGODB_URL: mongodb://127.0.0.1:${{ job.services.mongo.ports['27017'] }}/ieum_test
          MONGODB_DB_NAME: ieum_test
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/bluegreen -p 'test_*.py'
          pytest tests/

      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE_NAME:${{ github.sha }} \
            -t $IMAGE_NAME:latest .
